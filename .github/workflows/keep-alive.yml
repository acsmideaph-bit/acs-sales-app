name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity. This calls
# the anonymous ping() function twice a week so the project stays active.
# Reads the public URL and anon key from .env.production.
# Note: GitHub disables scheduled workflows in repos with no commits for 60
# days -- re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: '17 1 * * 1,4'   # Mon and Thu, 09:17 Manila
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call ping()
        run: |
          URL=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
